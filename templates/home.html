{% extends "base.html" %}
{% block title %}PortfolioHub{% endblock %}
{% block content %}
<div class="profile-header">
  <h1 data-i18n="home_title">Crée ton portfolio en une page</h1>
  <p class="bio" data-i18n="home_subtitle">Un lien partageable, prêt en quelques minutes.</p>
  <a class="primary" style="display:inline-block; margin-top:1rem; padding:0.7rem 1.4rem; border-radius:8px; background:var(--accent); color:white;"
     href="{{ url_for('create_page') }}" data-i18n="create_button">Créer mon portfolio</a>
</div>
{% endblock %}
{% block scripts %}
<script>
  initLanguage("fr");
  initTheme("light");
</script>
{% endblock %}
